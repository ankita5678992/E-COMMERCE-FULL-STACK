<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moist Leaf | Product Detail</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="product-page-body">
    <header class="navbar" style="position: relative; background: var(--hero-bg);">
        <a href="index.html" class="logo" style="text-decoration: none; color: var(--text-inverse);">KalAphra</a>
        <nav>
            <a href="index.html#home">Home</a>
            <a href="index.html#shop">Shop</a>
        </nav>
        <div class="search-wrap desktop-search">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="site-search" placeholder="Search products..." aria-label="Search products">
        </div>
        <div class="nav-actions">
            <button class="icon-btn cart-btn" aria-label="Cart" id="cart-open-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                <span class="cart-badge" id="cart-badge">0</span>
            </button>
        </div>
    </header>

    <main class="product-detail-container" id="product-detail-container">
        <!-- Product Details injected via JS -->
    </main>

    <!-- Cart Sidebar/Modal -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="icon-btn close-cart-btn" id="close-cart-btn" style="color: black; border-color: #ccc;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items injected here -->
        </div>
        <div class="cart-footer">
            <div class="coupon-box">
                <label for="coupon-input">Coupon code</label>
                <div class="coupon-row">
                    <input id="coupon-input" type="text" placeholder="Try SAVE10" maxlength="20">
                    <button type="button" id="apply-coupon-btn" class="secondary-btn small-btn">Apply</button>
                </div>
                <p class="coupon-message" id="coupon-message"></p>
            </div>

            <div class="payment-summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">₹0.00</span>
                </div>
                <div class="summary-row discount-row">
                    <span>Coupon discount</span>
                    <span id="summary-discount">-₹0.00</span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span id="summary-delivery">₹0.00</span>
                </div>
                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="cart-total-price">₹0.00</span>
                </div>
            </div>

            <button class="primary-btn dark-btn" id="checkout-btn" style="width: 100%;">Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
